<!-- Ardy Lab — Pagine "Storia di un pezzo": box informativo + chat di Sole
     Va in Divi → Opzioni del tema → Integrazione, nel riquadro del codice in fondo ai post
     (NON in WPCode). Copia di backup: wpcode-snippet-lavorazione.html nel repo ardyagent.

     Agisce SOLO sulle pagine create da Racconta (tag "storia-pezzo", vedi PIANO-RACCONTA.md).
     Le pagine lavorazione dei clienti non ricevono più niente (decisione 23/11): niente chat
     sulla pagina, le domande si fanno su WhatsApp, e il lavoro si segue nell'area cliente
     ardyagent.ardy-lab.it/lavoro/ (ANALISI-AREA-CLIENTE.md). -->
<script>
(function(){
  var postMatch = document.body.className.match(/postid-(\d+)/);
  if (!postMatch) return;

  // Si controlla lo SLUG del tag, non un ID numerico: se il tag venisse ricreato in WP
  // admin con un ID diverso, il controllo continua a funzionare.
  fetch('/wp-json/wp/v2/posts/' + postMatch[1] + '?_embed=wp:term')
    .then(function(r){ return r.json(); })
    .then(function(d){
      var gruppi = (d._embedded && d._embedded['wp:term']) || [];
      var isPezzo = gruppi.some(function(g){
        return g.some(function(t){ return t.slug === 'storia-pezzo'; });
      });
      if (!isPezzo) return;

      var entry = document.querySelector('.entry-content') || document.querySelector('article');
      if (entry) {
        var box = document.createElement('div');
        box.style.cssText = 'background:linear-gradient(135deg,#faf8f3,#f5f0e6);border:1px solid #c8a96e44;border-left:4px solid #c8a96e;border-radius:8px;padding:18px 22px;margin-bottom:28px;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;';
        box.innerHTML = '' +
          '<div style="display:flex;align-items:flex-start;gap:14px;">' +
            '<span style="font-size:28px;line-height:1;">🪑</span>' +
            '<div>' +
              '<div style="font-weight:600;font-size:15px;color:#333;margin-bottom:6px;">La storia di questo pezzo, raccontata dalla bottega</div>' +
              '<div style="font-size:13px;color:#666;line-height:1.6;">' +
                'Curioso di sapere che legno è, cosa abbiamo fatto e perché? Chiedilo a <strong>Sole</strong> dal bottone in basso a destra. ' +
                'E se hai un mobile a cui tieni, raccontaglielo: ti diamo un consiglio, senza impegno 🌿' +
              '</div>' +
            '</div>' +
          '</div>';
        entry.insertBefore(box, entry.firstChild);
      }

      // Il widget riconosce da solo la pagina-pezzo (stesso tag) e apre direttamente Sole.
      var s = document.createElement('script');
      s.src = 'https://ardyagent.ardy-lab.it/ardy-widget-lavorazione.js';
      document.body.appendChild(s);
    })
    .catch(function(){});
})();
</script>
