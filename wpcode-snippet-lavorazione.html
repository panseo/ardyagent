<!-- Ardy Lab — Widget Lavorazione + Info Banner -->
<script>
(function(){
  // Verifica che sia una pagina di lavorazione (categoria 102)
  var postMatch = document.body.className.match(/postid-(\d+)/);
  if (!postMatch) return;
  var postId = postMatch[1];

  fetch('/wp-json/wp/v2/posts/' + postId)
    .then(function(r){ return r.json(); })
    .then(function(d){
      if (!d.categories || !d.categories.includes(102)) return;

      // Inietta il box informativo PRIMA del contenuto
      var entry = document.querySelector('.entry-content') || document.querySelector('article');
      if (entry) {
        var infoBox = document.createElement('div');
        infoBox.style.cssText = 'background:linear-gradient(135deg,#faf8f3,#f5f0e6);border:1px solid #c8a96e44;border-left:4px solid #c8a96e;border-radius:8px;padding:18px 22px;margin-bottom:28px;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;';
        infoBox.innerHTML = '' +
          '<div style="display:flex;align-items:flex-start;gap:14px;">' +
            '<span style="font-size:28px;line-height:1;">🪑</span>' +
            '<div>' +
              '<div style="font-weight:600;font-size:15px;color:#333;margin-bottom:6px;">Hai domande su questa lavorazione?</div>' +
              '<div style="font-size:13px;color:#666;line-height:1.6;">' +
                'Se sei il cliente di questo lavoro, puoi usare il nostro <strong>assistente dedicato</strong> cliccando il bottone in basso a destra. ' +
                'Potrai chiedere dettagli sulle fasi di lavorazione, capire i termini tecnici e <strong>prenotare una visita in laboratorio</strong> per vedere il tuo pezzo dal vivo. ' +
                'Ti basterà verificarti con il numero di telefono che hai fornito.' +
              '</div>' +
            '</div>' +
          '</div>';
        entry.insertBefore(infoBox, entry.firstChild);
      }

      // Carica il widget
      var s = document.createElement('script');
      s.src = 'https://ardyagent.ardy-lab.it/ardy-widget-lavorazione.js';
      document.body.appendChild(s);
    })
    .catch(function(){});
})();
</script>
