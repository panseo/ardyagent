<!-- Ardy Lab — Widget Lavorazione + Info Banner -->
<script>
(function(){
  // Verifica che sia una pagina di lavorazione (categoria "lavori-in-corso")
  var postMatch = document.body.className.match(/postid-(\d+)/);
  if (!postMatch) return;
  var postId = postMatch[1];

  // _embed=wp:term include le tassonomie (categorie/tag) del post: controlliamo
  // lo SLUG invece dell'ID numerico, così se la categoria viene ricreata con un
  // ID diverso in WP admin questo controllo continua a funzionare.
  fetch('/wp-json/wp/v2/posts/' + postId + '?_embed=wp:term')
    .then(function(r){ return r.json(); })
    .then(function(d){
      var termGroups = (d._embedded && d._embedded['wp:term']) || [];
      var isLavorazione = termGroups.some(function(group){
        return group.some(function(t){ return t.slug === 'lavori-in-corso'; });
      });
      if (!isLavorazione) return;

      // Inietta il box informativo PRIMA del contenuto
      var entry = document.querySelector('.entry-content') || document.querySelector('article');
      if (entry) {
        var infoBox = document.createElement('div');
        infoBox.style.cssText = 'background:linear-gradient(135deg,#faf8f3,#f5f0e6);border:1px solid #c8a96e44;border-left:4px solid #c8a96e;border-radius:8px;padding:18px 22px;margin-bottom:28px;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;';
        infoBox.innerHTML = '' +
          '<div style="display:flex;align-items:flex-start;gap:14px;">' +
            '<span style="font-size:28px;line-height:1;">🪑</span>' +
            '<div>' +
              '<div style="font-weight:600;font-size:15px;color:#333;margin-bottom:6px;">Hai domande su questa lavorazione?</div>' +
              '<div style="font-size:13px;color:#666;line-height:1.6;">' +
                'Se sei il cliente di questo lavoro, usa il nostro <strong>assistente dedicato</strong> dal bottone in basso a destra: ' +
                'puoi chiedere dettagli sulle fasi, capire i termini tecnici e <strong>prenotare una visita in laboratorio</strong> per vedere il tuo pezzo dal vivo.' +
              '</div>' +
              '<div style="font-size:13px;color:#666;line-height:1.6;margin-top:10px;">' +
                'E se non sei (ancora) un nostro cliente? Sei il benvenuto lo stesso 🌿 — questa pagina è una finestra sul nostro lavoro artigianale. ' +
                'Hai un mobile a cui tieni o una curiosità sul restauro? <strong>Scrivici pure dalla chat</strong>: siamo felici di darti un consiglio, senza impegno.' +
              '</div>' +
            '</div>' +
          '</div>';
        entry.insertBefore(infoBox, entry.firstChild);
      }

      // Carica il widget
      var s = document.createElement('script');
      s.src = 'https://ardyagent.ardy-lab.it/ardy-widget-lavorazione.js';
      document.body.appendChild(s);
    })
    .catch(function(){});
})();
</script>
