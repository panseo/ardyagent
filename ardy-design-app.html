<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Ardy Design — Progetti</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* Token brand — allineati a ardy-michela-app.css (:root). Tenuti qui per partire
     theming-ready senza ereditare i 363 stili inline della dash principale. */
  :root {
    --bg:#0e0e0e; --surface:#161616; --surface2:#1e1e1e; --border:#2a2a2a;
    --accent:#c8a96e; --accent2:#8b6f3e; --text:#e8e2d9; --text-dim:#7a7470;
    --text-mid:#b0a89e; --red:#c0392b; --green:#27ae60; --blue:#2980b9;
    --orange:#e67e22; --yellow:#f1c40f;
    --radius:10px; --radius-sm:7px; --space:16px; --shadow:0 4px 18px rgba(0,0,0,.35);
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--bg); color:var(--text); font-family:'DM Sans',sans-serif; font-size:14px; min-height:100vh; }
  a { color:var(--accent); }

  header {
    background:var(--surface); border-bottom:1px solid var(--border); padding:0 24px;
    height:56px; display:flex; align-items:center; justify-content:space-between;
    position:sticky; top:0; z-index:100;
  }
  .logo { font-family:'Bebas Neue',sans-serif; font-size:24px; letter-spacing:3px; color:var(--accent); }
  .logo small { color:var(--text-dim); letter-spacing:2px; font-size:13px; margin-left:8px; }
  header a.back { font-size:13px; color:var(--text-mid); text-decoration:none; }
  header a.back:hover { color:var(--accent); }

  .layout { display:grid; grid-template-columns:320px 1fr; min-height:calc(100vh - 56px); }
  .sidebar { background:var(--surface); border-right:1px solid var(--border); padding:16px; overflow-y:auto; }
  .main { padding:24px; overflow-y:auto; max-width:1100px; }

  button {
    font-family:inherit; font-size:13px; cursor:pointer; border:1px solid var(--border);
    background:var(--surface2); color:var(--text); padding:8px 14px; border-radius:var(--radius-sm);
    transition:.15s;
  }
  button:hover { border-color:var(--accent); }
  button.primary { background:var(--accent); color:#1a1407; border-color:var(--accent); font-weight:600; }
  button.primary:hover { background:#d8ba80; }
  button.ghost { background:transparent; }
  button.danger:hover { border-color:var(--red); color:var(--red); }
  button.sm { padding:5px 10px; font-size:12px; }

  input, select, textarea {
    font-family:inherit; font-size:13px; background:var(--bg); color:var(--text);
    border:1px solid var(--border); border-radius:var(--radius-sm); padding:8px 10px; width:100%;
  }
  input:focus, select:focus, textarea:focus { outline:none; border-color:var(--accent); }
  textarea { resize:vertical; min-height:64px; }
  label { display:block; font-size:11px; text-transform:uppercase; letter-spacing:1px; color:var(--text-dim); margin:0 0 5px; }
  .field { margin-bottom:14px; }
  .row { display:flex; gap:12px; flex-wrap:wrap; }
  .row > .field { flex:1; min-width:140px; }

  .newbtn { width:100%; margin-bottom:14px; }
  .plist { display:flex; flex-direction:column; gap:8px; }
  .pcard {
    background:var(--surface2); border:1px solid var(--border); border-radius:var(--radius-sm);
    padding:11px 13px; cursor:pointer; transition:.15s;
  }
  .pcard:hover { border-color:var(--accent2); }
  .pcard.active { border-color:var(--accent); background:#221d12; }
  .pcard .t { font-weight:600; margin-bottom:4px; }
  .pcard .meta { font-size:11px; color:var(--text-dim); display:flex; gap:8px; align-items:center; }

  .badge { display:inline-block; font-size:10px; letter-spacing:.5px; padding:2px 7px; border-radius:20px; border:1px solid var(--border); text-transform:uppercase; }
  .badge.IDEA{color:var(--text-mid)} .badge.PROGETTAZIONE{color:var(--blue);border-color:var(--blue)}
  .badge.PROTOTIPO{color:var(--orange);border-color:var(--orange)} .badge.FILE_CONGELATO{color:var(--yellow);border-color:var(--yellow)}
  .badge.PRODUZIONE{color:var(--accent);border-color:var(--accent)} .badge.FOTOGRAFIA{color:var(--text)}
  .badge.A_CATALOGO{color:var(--green);border-color:var(--green)}

  .panel { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:18px; margin-bottom:18px; box-shadow:var(--shadow); }
  .panel h2 { font-family:'Bebas Neue',sans-serif; font-size:18px; letter-spacing:2px; color:var(--accent); margin-bottom:14px; font-weight:400; }
  .panel h2 small { color:var(--text-dim); font-family:'DM Sans'; font-size:11px; letter-spacing:.5px; }

  /* Pipeline stati */
  .pipeline { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:8px; }
  .step { font-size:11px; padding:6px 10px; border-radius:20px; border:1px solid var(--border); background:var(--surface2); cursor:pointer; color:var(--text-dim); white-space:nowrap; }
  .step:hover { border-color:var(--accent); }
  .step.done { color:var(--text-mid); }
  .step.current { background:var(--accent); color:#1a1407; border-color:var(--accent); font-weight:600; }

  table.bom { width:100%; border-collapse:collapse; font-size:13px; }
  table.bom th { text-align:left; font-size:10px; text-transform:uppercase; letter-spacing:1px; color:var(--text-dim); padding:6px 6px; border-bottom:1px solid var(--border); }
  table.bom td { padding:4px 6px; border-bottom:1px solid var(--surface2); vertical-align:middle; }
  table.bom input, table.bom select { padding:5px 7px; font-size:12px; }
  .num { font-family:'DM Mono',monospace; text-align:right; }
  .costbar { display:flex; gap:24px; flex-wrap:wrap; margin-top:14px; padding-top:14px; border-top:1px solid var(--border); }
  .costbar .b { font-family:'DM Mono',monospace; }
  .costbar .b span { display:block; font-family:'DM Sans'; font-size:11px; text-transform:uppercase; letter-spacing:1px; color:var(--text-dim); margin-bottom:3px; }
  .costbar .b b { font-size:20px; font-weight:500; }
  .pos{color:var(--green)} .neg{color:var(--red)}

  .iter { background:var(--surface2); border:1px solid var(--border); border-radius:var(--radius-sm); padding:10px 12px; margin-bottom:8px; }
  .iter .h { display:flex; justify-content:space-between; align-items:center; margin-bottom:6px; }
  .iter .vtag { font-family:'DM Mono',monospace; color:var(--accent); font-weight:500; }

  .thumbs { display:flex; flex-wrap:wrap; gap:8px; margin-top:8px; }
  .thumb { width:74px; height:74px; object-fit:cover; border-radius:var(--radius-sm); border:1px solid var(--border); display:block; }
  .thumbwrap { position:relative; }
  .thumbwrap .x { position:absolute; top:-6px; right:-6px; width:20px; height:20px; padding:0; border-radius:50%; background:var(--red); color:#fff; border:none; font-size:11px; line-height:1; cursor:pointer; }

  /* Archivio file di stampa */
  .filelist { display:flex; flex-direction:column; gap:6px; }
  .filerow { display:flex; align-items:center; gap:10px; background:var(--surface2); border:1px solid var(--border); border-radius:var(--radius-sm); padding:8px 10px; }
  .filerow .fname { font-family:'DM Mono',monospace; color:var(--text); text-decoration:none; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:320px; }
  .filerow .fname:hover { color:var(--accent); text-decoration:underline; }
  .filerow .fnote { flex:1; min-width:60px; }
  .filerow .factions { margin-left:auto; display:flex; gap:6px; white-space:nowrap; }
  .filerow a { text-decoration:none; }
  .badge.filecat { color:var(--accent); border-color:var(--accent2); text-transform:uppercase; }
  .filebtn { display:inline-block; font-size:13px; cursor:pointer; border:1px solid var(--border); background:var(--surface2); color:var(--text); padding:8px 14px; border-radius:var(--radius-sm); transition:.15s; }
  .filebtn:hover { border-color:var(--accent); }
  .filebtn input { display:none; }
  .frozen { margin-top:12px; padding:10px 12px; border:1px solid var(--accent2); border-radius:var(--radius-sm); background:#1c1810; }
  .frozen b { color:var(--accent); }

  .empty { color:var(--text-dim); text-align:center; padding:60px 20px; }
  .muted { color:var(--text-dim); font-size:12px; }
  .toast { position:fixed; bottom:24px; left:50%; transform:translateX(-50%); background:var(--surface2); border:1px solid var(--accent); color:var(--text); padding:10px 18px; border-radius:var(--radius-sm); box-shadow:var(--shadow); opacity:0; transition:.2s; pointer-events:none; z-index:300; }
  .toast.show { opacity:1; }
  .hidden { display:none !important; }
  @media (max-width:760px){ .layout{grid-template-columns:1fr} .sidebar{border-right:none;border-bottom:1px solid var(--border)} }
</style>
</head>
<body>
<header>
  <div class="logo">ARDY DESIGN <small>progetti interni</small></div>
  <div style="display:flex;align-items:center;gap:14px">
    <button class="ghost sm" onclick="window.open('ardy-guida-design.html','_blank')">❓ Guida</button>
    <a class="back" href="ardy-michela-app.html">← Dash principale</a>
  </div>
</header>

<div class="layout">
  <aside class="sidebar">
    <button class="primary newbtn" onclick="nuovoProgetto()">+ Nuovo progetto</button>
    <div class="plist" id="plist"></div>
  </aside>

  <main class="main" id="main">
    <div class="empty">Seleziona un progetto o creane uno nuovo.</div>
  </main>
</div>

<div class="toast" id="toast"></div>

<script>
const API = 'ardy-progetti-api.php';
const TIPI = ['lampada','mobile','complemento','restyling','prototipo'];
const STATI = ['IDEA','PROGETTAZIONE','PROTOTIPO','FILE_CONGELATO','PRODUZIONE','FOTOGRAFIA','A_CATALOGO'];
const CATEGORIE = ['filamento','stampa','elettrico','ferramenta','finitura','imballo','manodopera'];
const UNITA_DEF = { filamento:'g', stampa:'h', manodopera:'h' };
let stato = { lista:[], sel:null, dettaglio:null, costoOrario:50, faseForm:null };

const eur = n => (n===null||n===undefined||n==='') ? '—' : Number(n).toLocaleString('it-IT',{style:'currency',currency:'EUR'});
const esc = s => (s??'').toString().replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),1800); }

async function api(method, body){
  const opt = { method, headers:{'Content-Type':'application/json'} };
  if (body) opt.body = JSON.stringify(body);
  const r = await fetch(API + (method==='GET'&&body?('?'+new URLSearchParams(body)):''), method==='GET'?{}:opt);
  return r.json();
}

// ── Lista ───────────────────────────────────────────────
async function caricaLista(){
  const d = await api('GET');
  stato.lista = d.progetti || [];
  renderLista();
}
function renderLista(){
  const el = document.getElementById('plist');
  if (!stato.lista.length){ el.innerHTML = '<div class="muted" style="padding:8px">Nessun progetto.</div>'; return; }
  el.innerHTML = stato.lista.map(p => `
    <div class="pcard ${p.id===stato.sel?'active':''}" onclick="apri(${p.id})">
      <div class="t">${esc(p.titolo)||'(senza titolo)'}</div>
      <div class="meta">
        <span class="badge ${p.stato}">${p.stato.replace('_',' ')}</span>
        <span>${esc(p.tipo)}</span>
        ${p.margine!==null?`<span class="${p.margine>=0?'pos':'neg'}">${eur(p.margine)}</span>`:''}
      </div>
    </div>`).join('');
}

// ── Dettaglio ───────────────────────────────────────────
async function apri(id){
  stato.sel = id;
  const d = await api('GET', { id });
  if (!d.success){ toast('Errore caricamento'); return; }
  stato.dettaglio = d;
  if (d.config) stato.costoOrario = d.config.costo_orario;
  renderLista();
  renderDettaglio();
}

function nuovoProgetto(){
  stato.sel = null;
  stato.dettaglio = { progetto:{ id:0, titolo:'', tipo:'lampada', stato:'IDEA', descrizione:'', materiali:'', scheda_tecnica:'', scarto_pct:10, prezzo_vendita:'', tempo_lavoro:'', costo_produzione:null, margine:null }, materiali:[], iterazioni:[], fasi:[], file:[] };
  renderLista();
  renderDettaglio(true);
}

function renderDettaglio(nuovo=false){
  const p = stato.dettaglio.progetto;
  const stepi = STATI.indexOf(p.stato);
  document.getElementById('main').innerHTML = `
    <div class="panel">
      <div class="row">
        <div class="field" style="flex:2"><label>Titolo</label><input id="f_titolo" value="${esc(p.titolo)}" placeholder="Es. Lampada Orbit"></div>
        <div class="field"><label>Tipo</label><select id="f_tipo">${TIPI.map(t=>`<option ${t===p.tipo?'selected':''}>${t}</option>`).join('')}</select></div>
      </div>

      ${p.id?`
      <label>Ciclo di vita</label>
      <div class="pipeline">
        ${STATI.map((s,i)=>`<div class="step ${i<stepi?'done':''} ${i===stepi?'current':''}" onclick="cambiaStato('${s}')">${s.replace('_',' ')}</div>`).join('')}
      </div>
      <div class="muted" style="margin-bottom:8px">Lo stato terminale è <b>A CATALOGO</b>: stock e vendita vivono su Woo/Etsy, non qui.</div>
      `:''}

      <div class="field"><label>Descrizione / concept</label><textarea id="f_descrizione" placeholder="Il racconto del pezzo">${esc(p.descrizione)}</textarea></div>
      <div class="field"><label>Materiali (testo pubblico per la listing)</label><textarea id="f_materiali" placeholder="Es. PLA riciclato, ottone, cavo tessile">${esc(p.materiali)}</textarea></div>
      <div class="field"><label>Scheda tecnica</label><textarea id="f_scheda_tecnica" placeholder="Dimensioni, finiture, e per la lampada: attacco, V, cavo, peso…">${esc(p.scheda_tecnica)}</textarea></div>
      <div class="row">
        <div class="field"><label>Tempo lavoro</label><input id="f_tempo_lavoro" value="${esc(p.tempo_lavoro)}" placeholder="Es. 6h"></div>
        <div class="field"><label>Prezzo vendita (suggerito) €</label><input id="f_prezzo_vendita" class="num" value="${p.prezzo_vendita??''}" placeholder="0,00"></div>
        <div class="field"><label>Scarto stampa %</label><input id="f_scarto_pct" class="num" value="${p.scarto_pct??10}"></div>
      </div>
      <div class="row" style="align-items:center">
        <button class="primary" onclick="salvaProgetto()">${p.id?'Salva modifiche':'Crea progetto'}</button>
        ${p.id?`<button class="ghost danger" onclick="eliminaProgetto()">Elimina</button>`:''}
        ${p.id?`<button class="ghost" onclick="nuovaCongela()">${p.file_congelato_at?'🔒 Aggiorna versione congelata':'⏟ Congela file'}</button>`:''}
      </div>
      ${p.id && p.file_congelato_at ? congelatoSummary() : ''}
    </div>

    ${p.id?(stato.congelaForm?congelaFormHtml():'')+filePanel()+bomPanel()+iterPanel()+fasiPanel():'<div class="muted">Salva il progetto per gestire file, costi, prototipi e contenuti.</div>'}
  `;
}

function val(id){ const e=document.getElementById(id); return e?e.value:''; }

async function salvaProgetto(){
  const body = {
    mode:'save', id: stato.dettaglio.progetto.id, stato: stato.dettaglio.progetto.stato,
    titolo:val('f_titolo'), tipo:val('f_tipo'), descrizione:val('f_descrizione'),
    materiali:val('f_materiali'), scheda_tecnica:val('f_scheda_tecnica'),
    tempo_lavoro:val('f_tempo_lavoro'), prezzo_vendita:val('f_prezzo_vendita'), scarto_pct:val('f_scarto_pct')
  };
  if (!body.titolo.trim()){ toast('Titolo mancante'); return; }
  const d = await api('POST', body);
  if (!d.success){ toast(d.error||'Errore'); return; }
  toast('Salvato'); await caricaLista(); apri(d.id);
}
async function cambiaStato(s){
  const d = await api('POST', { mode:'stato', id:stato.dettaglio.progetto.id, stato:s });
  if (d.success){ toast('Stato → '+s.replace('_',' ')); apri(stato.dettaglio.progetto.id); caricaLista(); }
}
async function eliminaProgetto(){
  if (!confirm('Eliminare il progetto? (spostato nel cestino)')) return;
  await api('POST', { mode:'delete', id:stato.dettaglio.progetto.id });
  stato.sel=null; stato.dettaglio=null;
  document.getElementById('main').innerHTML='<div class="empty">Progetto eliminato.</div>';
  caricaLista();
}
// Congelamento: invece dei prompt testuali, scegli QUALI file dell'archivio sono la
// versione definitiva di produzione. Lo snapshot ne salva una copia stabile (id+nome+
// categoria), così resta leggibile anche se poi l'archivio cambia.
function nuovaCongela(){
  const snap = stato.dettaglio.progetto.file_snapshot || {};
  stato.congelaForm = {
    file_ids: Array.isArray(snap.file_ids) ? snap.file_ids.slice() : [],
    profilo_orca: snap.profilo_orca || '',
    grammi: snap.grammi ?? '',
    ore: snap.ore ?? '',
  };
  renderDettaglio();
}
function congelaFormHtml(){
  const cf = stato.congelaForm;
  const files = stato.dettaglio.file || [];
  return `
  <div class="panel" style="background:var(--surface2);border-color:var(--accent2)">
    <h2>⏟ Congela versione di produzione <small>scegli i file definitivi di questo lotto</small></h2>
    ${files.length ? `
      <label>File definitivi (spunta quelli con cui produci)</label>
      <div class="filelist" style="margin-bottom:12px">
        ${files.map(f=>`
          <label class="filerow" style="cursor:pointer">
            <input type="checkbox" style="width:auto" ${cf.file_ids.includes(f.id)?'checked':''} onchange="toggleCongelaFile(${f.id})">
            <span class="badge filecat">${esc(f.categoria)}</span>
            <span class="fname">${esc(f.nome_originale)}</span>
            <span class="muted">${fmtBytes(f.dimensione)}</span>
          </label>`).join('')}
      </div>`
    : '<div class="muted" style="margin-bottom:12px">Nessun file in archivio: carica prima gli STL/3MF qui sotto, oppure congela solo i parametri.</div>'}
    <div class="row">
      <div class="field"><label>Profilo stampa (OrcaSlicer)</label><input id="cg_profilo" value="${esc(cf.profilo_orca)}" placeholder="Es. 0.2 PLA standard"></div>
      <div class="field"><label>Grammi filamento</label><input id="cg_grammi" class="num" value="${esc(cf.grammi)}" placeholder="da Orca"></div>
      <div class="field"><label>Ore stampa</label><input id="cg_ore" class="num" value="${esc(cf.ore)}" placeholder="da Orca"></div>
    </div>
    <div class="row">
      <button class="primary" onclick="salvaCongela()">🔒 Congela questa versione</button>
      <button class="ghost" onclick="annullaCongela()">Annulla</button>
    </div>
  </div>`;
}
function captureCongela(){
  if (!stato.congelaForm) return;
  const p=document.getElementById('cg_profilo'), g=document.getElementById('cg_grammi'), o=document.getElementById('cg_ore');
  if (p) stato.congelaForm.profilo_orca = p.value;
  if (g) stato.congelaForm.grammi = g.value;
  if (o) stato.congelaForm.ore = o.value;
}
function toggleCongelaFile(id){
  captureCongela();
  const arr = stato.congelaForm.file_ids, i = arr.indexOf(id);
  if (i>=0) arr.splice(i,1); else arr.push(id);
  renderDettaglio();
}
function annullaCongela(){ stato.congelaForm = null; renderDettaglio(); }
async function salvaCongela(){
  captureCongela();
  const cf = stato.congelaForm;
  const files = (stato.dettaglio.file||[]).filter(f=>cf.file_ids.includes(f.id))
    .map(f=>({ id:f.id, nome:f.nome_originale, categoria:f.categoria, dimensione:f.dimensione }));
  const snapshot = {
    file_ids: cf.file_ids, files,
    profilo_orca: cf.profilo_orca, grammi: cf.grammi, ore: cf.ore,
    congelato: new Date().toISOString(),
  };
  const d = await api('POST', { mode:'congela', id:stato.dettaglio.progetto.id, snapshot });
  if (d.success){ stato.congelaForm=null; toast('Versione congelata'); apri(stato.dettaglio.progetto.id); caricaLista(); }
  else toast(d.error||'Errore');
}
function congelatoSummary(){
  const p = stato.dettaglio.progetto;
  const snap = p.file_snapshot || {};
  const files = Array.isArray(snap.files) ? snap.files : [];
  const fileLabel = files.length ? files.map(f=>esc(f.nome)).join(', ') : (snap.stl ? esc(snap.stl) : '');
  const meta = [snap.profilo_orca?`profilo ${esc(snap.profilo_orca)}`:'', snap.grammi?`${esc(snap.grammi)} g`:'', snap.ore?`${esc(snap.ore)} h`:''].filter(Boolean).join(' · ');
  return `
  <div class="frozen">
    <div><b>🔒 Versione congelata</b> <span class="muted">${(p.file_congelato_at||'').slice(0,16).replace('T',' ')}</span></div>
    ${fileLabel?`<div class="muted" style="margin-top:4px">File: ${fileLabel}</div>`:''}
    ${meta?`<div class="muted">${meta}</div>`:''}
  </div>`;
}

// ── Archivio file di stampa (STL / 3MF / G-code / CAD) ──
const FILE_API = 'ardy-progetti-file-api.php';
const FILE_CATS = [['stl','STL / mesh'],['3mf','3MF · slicer'],['gcode','G-code'],['cad','CAD / STEP'],['altro','Altro']];
const FILE_ACCEPT = '.stl,.obj,.3mf,.gcode,.gco,.g,.bgcode,.step,.stp,.f3d,.scad,.dwg,.dxf,.igs,.iges,.zip';

function fmtBytes(n){ n=Number(n)||0; if(n<1024) return n+' B'; const u=['KB','MB','GB']; let i=-1; do{ n/=1024; i++; }while(n>=1024&&i<u.length-1); return (n<10?n.toFixed(1):Math.round(n))+' '+u[i]; }
function fileDownloadUrl(f){ return `${FILE_API}?progetto_id=${stato.dettaglio.progetto.id}&file_id=${f.id}&download=1`; }

function filePanel(){
  const files = stato.dettaglio.file || [];
  return `
  <div class="panel">
    <h2>Archivio file di stampa <small>STL · 3MF · G-code · CAD — preleva e stampa</small></h2>
    ${files.length ? `<div class="filelist">${files.map(f=>fileRow(f)).join('')}</div>`
                   : '<div class="muted">Nessun file in archivio. Carica gli STL / 3MF / G-code del pezzo, li prelevi quando stampi.</div>'}
    <div class="row" style="margin-top:14px;align-items:flex-end">
      <div class="field"><label>Categoria</label><select id="up_cat">${FILE_CATS.map(c=>`<option value="${c[0]}">${c[1]}</option>`).join('')}</select></div>
      <div class="field" style="flex:2"><label>Nota (opzionale)</label><input id="up_note" placeholder="Es. v3 definitivo · profilo 0.2 PLA · solo corpo"></div>
    </div>
    <div class="row" style="align-items:center">
      <input type="file" id="up_file" multiple accept="${FILE_ACCEPT}" style="flex:1;min-width:200px">
      <button class="primary" id="upBtn" onclick="caricaFile()">⬆ Carica nell'archivio</button>
    </div>
    <div id="upOut" class="muted" style="margin-top:6px">Ammessi STL, OBJ, 3MF, G-code, STEP/CAD, ZIP — fino a 150 MB per file.</div>
  </div>`;
}
function fileRow(f){
  return `<div class="filerow">
    <span class="badge filecat">${esc(f.categoria)}</span>
    <a class="fname" href="${fileDownloadUrl(f)}" download title="${esc(f.nome_originale)}">${esc(f.nome_originale)}</a>
    <span class="muted">${fmtBytes(f.dimensione)}</span>
    ${f.note?`<span class="muted fnote">${esc(f.note)}</span>`:'<span class="fnote"></span>'}
    <span class="factions">
      <a href="${fileDownloadUrl(f)}" download><button class="sm">⬇ Scarica</button></a>
      <button class="sm ghost danger" onclick="eliminaFile(${f.id})">✕</button>
    </span>
  </div>`;
}
async function caricaFile(){
  const input = document.getElementById('up_file');
  const files = Array.from(input.files||[]);
  if (!files.length){ toast('Scegli almeno un file'); return; }
  const cat = val('up_cat'), note = val('up_note');
  const btn = document.getElementById('upBtn'), out = document.getElementById('upOut');
  btn.disabled = true; const txt = btn.textContent;
  let ok=0, fail=0, lastErr='';
  for (let i=0; i<files.length; i++){
    const file = files[i];
    btn.textContent = `⏳ Carico ${i+1}/${files.length}…`;
    const fd = new FormData();
    fd.append('mode','upload'); fd.append('progetto_id', stato.dettaglio.progetto.id);
    fd.append('categoria', cat); fd.append('note', note); fd.append('file', file);
    try {
      const d = await fetch(FILE_API, { method:'POST', body: fd }).then(r=>r.json());
      if (d.success) ok++; else { fail++; lastErr = `${file.name}: ${d.error||'errore'}`; }
    } catch(e){ fail++; lastErr = 'Errore di rete'; }
  }
  btn.disabled = false; btn.textContent = txt;
  if (fail && out) out.innerHTML = `<span class="neg">${esc(lastErr)}</span>`;
  toast(ok ? `Caricati ${ok} file${fail?` · ${fail} falliti`:''}` : 'Upload fallito');
  apri(stato.dettaglio.progetto.id);
}
async function eliminaFile(id){
  if (!confirm('Eliminare questo file dall\'archivio?')) return;
  await fetch(FILE_API, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ mode:'delete', id }) });
  toast('File eliminato'); apri(stato.dettaglio.progetto.id);
}

// ── BOM / costi ─────────────────────────────────────────
function bomPanel(){
  const mats = stato.dettaglio.materiali;
  const p = stato.dettaglio.progetto;
  const somma = mats.reduce((s,m)=>s+Number(m.costo_riga||0),0);
  return `
  <div class="panel">
    <h2>Costi — distinta materiali <small>uso interno · margine</small></h2>
    <table class="bom">
      <thead><tr><th>Categoria</th><th>Voce</th><th>Q.tà</th><th>Unità</th><th>€ unit.</th><th>€ riga</th><th></th></tr></thead>
      <tbody>
        ${mats.map(m=>bomRow(m)).join('')}
        ${bomRow({id:0,categoria:'filamento',voce:'',qta:'',unita:'g',costo_unitario:'',costo_riga:0}, true)}
      </tbody>
    </table>
    <div class="costbar">
      <div class="b"><span>Somma BOM</span><b>${eur(somma)}</b></div>
      <div class="b"><span>Costo prod. (×scarto ${p.scarto_pct||0}%)</span><b>${eur(p.costo_produzione)}</b></div>
      <div class="b"><span>Prezzo vendita</span><b>${eur(p.prezzo_vendita)}</b></div>
      <div class="b"><span>Margine</span><b class="${p.margine>=0?'pos':'neg'}">${eur(p.margine)}</b></div>
    </div>
    <div class="muted" style="margin-top:8px">Filamento (g) e stampa (h) si compilano coi numeri di OrcaSlicer. Manodopera default ${eur(stato.costoOrario)}/h.</div>
  </div>`;
}
function bomRow(m, isNew=false){
  const rid = isNew?'new':m.id;
  return `<tr data-mid="${m.id}">
    <td><select id="m_cat_${rid}" onchange="onCat('${rid}')">${CATEGORIE.map(c=>`<option ${c===m.categoria?'selected':''}>${c}</option>`).join('')}</select></td>
    <td><input id="m_voce_${rid}" value="${esc(m.voce)}" placeholder="${isNew?'+ nuova voce…':''}"></td>
    <td><input id="m_qta_${rid}" class="num" value="${m.qta!==''&&m.qta!=null?Number(m.qta):''}" style="width:70px" oninput="onQta('${rid}')"></td>
    <td><input id="m_unita_${rid}" value="${esc(m.unita)}" style="width:48px"></td>
    <td><input id="m_cu_${rid}" class="num" value="${m.costo_unitario!==''&&m.costo_unitario!=null?Number(m.costo_unitario):''}" style="width:80px" oninput="onQta('${rid}')"></td>
    <td class="num" id="m_riga_${rid}">${eur(m.costo_riga)}</td>
    <td>${isNew
        ? `<button class="sm" onclick="salvaMat('new')">Aggiungi</button>`
        : `<button class="sm" onclick="salvaMat(${m.id})">✓</button> <button class="sm ghost danger" onclick="eliminaMat(${m.id})">✕</button>`}</td>
  </tr>`;
}
function onCat(rid){ // pre-compila unità e tariffa manodopera
  const cat = val('m_cat_'+rid);
  const u = document.getElementById('m_unita_'+rid); if (u && UNITA_DEF[cat]) u.value = UNITA_DEF[cat];
  if (cat==='manodopera'){ const cu=document.getElementById('m_cu_'+rid); if (cu && !cu.value) cu.value = stato.costoOrario; }
  onQta(rid);
}
function onQta(rid){
  const q = parseFloat((val('m_qta_'+rid)||'0').replace(',','.'))||0;
  const cu = parseFloat((val('m_cu_'+rid)||'0').replace(',','.'))||0;
  const cell = document.getElementById('m_riga_'+rid); if (cell) cell.textContent = eur(Math.round(q*cu*100)/100);
}
async function salvaMat(rid){
  const body = { mode:'mat_save', progetto_id:stato.dettaglio.progetto.id,
    id: rid==='new'?0:rid, categoria:val('m_cat_'+rid), voce:val('m_voce_'+rid),
    qta:val('m_qta_'+rid), unita:val('m_unita_'+rid), costo_unitario:val('m_cu_'+rid) };
  const d = await api('POST', body);
  if (d.success){ toast('Costo aggiornato'); apri(stato.dettaglio.progetto.id); caricaLista(); }
  else toast(d.error||'Errore');
}
async function eliminaMat(id){
  await api('POST', { mode:'mat_delete', id });
  apri(stato.dettaglio.progetto.id); caricaLista();
}

// ── Iterazioni prototipo (binario R&D) ──────────────────
function iterPanel(){
  const its = stato.dettaglio.iterazioni;
  return `
  <div class="panel">
    <h2>Prototipo — iterazioni <small>binario R&amp;D interno</small></h2>
    ${its.map(it=>`
      <div class="iter">
        <div class="h"><span class="vtag">v${it.v_num}</span>
          <span><button class="sm ghost danger" onclick="eliminaIter(${it.id})">✕</button></span></div>
        <div class="muted">${esc(it.note)||'(nessuna nota)'}</div>
        ${it.cad_ref?`<div class="muted">CAD: ${esc(it.cad_ref)}</div>`:''}
      </div>`).join('') || '<div class="muted">Nessuna iterazione ancora.</div>'}
    <div class="field" style="margin-top:12px"><label>Nuova iterazione — note ("qui non torna…")</label>
      <textarea id="iter_note" placeholder="Cosa hai cambiato / cosa non va"></textarea></div>
    <div class="row">
      <div class="field"><label>Rif. CAD / profilo</label><input id="iter_cad" placeholder="opzionale"></div>
      <div style="align-self:flex-end"><button class="primary" onclick="salvaIter()">+ Aggiungi iterazione</button></div>
    </div>
  </div>`;
}
async function salvaIter(){
  const note = val('iter_note');
  if (!note.trim()){ toast('Scrivi una nota'); return; }
  const d = await api('POST', { mode:'iter_save', progetto_id:stato.dettaglio.progetto.id, note, cad_ref:val('iter_cad') });
  if (d.success){ toast('Iterazione v'+d.v_num+' aggiunta'); apri(stato.dettaglio.progetto.id); }
}
async function eliminaIter(id){
  await api('POST', { mode:'iter_delete', id });
  apri(stato.dettaglio.progetto.id);
}

// ── Fasi (binario racconto) — editor completo + upload foto ──
const FASI_API = 'ardy-progetti-fasi-api.php';
function fotoUrlFase(faseId, file){ return `${FASI_API}?progetto_id=${stato.dettaglio.progetto.id}&fase_id=${faseId}&file=${encodeURIComponent(file)}`; }

function fasiPanel(){
  const fasi = stato.dettaglio.fasi;
  const pid = stato.dettaglio.progetto.id;
  return `
  <div class="panel">
    <h2>Contenuti — fasi racconto <small>foto + testo per reel / social / WordPress</small></h2>
    ${fasi.length ? fasi.map(f=>`
      <div class="iter">
        <div class="h"><b>${esc(f.fase_nome)||'(senza titolo)'}</b>
          <span><button class="sm" onclick="editFase(${f.id})">Modifica</button>
                <button class="sm ghost danger" onclick="eliminaFase(${f.id})">✕</button></span></div>
        ${f.testo_breve?`<div class="muted">${esc(f.testo_breve)}</div>`:''}
        ${(f.foto_urls&&f.foto_urls.length)?`<div class="thumbs">${f.foto_urls.map(fn=>`<img class="thumb" src="${fotoUrlFase(f.id,fn)}" alt="">`).join('')}</div>`:''}
      </div>`).join('') : '<div class="muted">Nessuna fase-contenuto ancora.</div>'}

    ${stato.faseForm ? fasiFormHtml() : `<button class="primary" style="margin-top:8px" onclick="nuovaFase()">+ Aggiungi fase</button>`}

    ${fasi.length ? `
    <div style="margin-top:16px;padding-top:14px;border-top:1px solid var(--border)">
      <button onclick="creaReel()" id="reelBtn">🎬 Crea reel dalle foto</button>
      <span class="muted" style="margin-left:8px">Servono almeno 2 foto totali. Montaggio verticale 9:16.</span>
      <div id="reelOut" style="margin-top:10px"></div>
    </div>` : ''}
    <div class="muted" style="margin-top:10px">⏭️ Pubblicazione social/WordPress da queste fasi: slice successiva. Il reel è già attivo (legge le foto di progetto da disco).</div>
  </div>`;
}
async function creaReel(){
  const btn = document.getElementById('reelBtn');
  const out = document.getElementById('reelOut');
  btn.disabled = true; const txt = btn.textContent; btn.textContent = '⏳ Monto il reel… (può richiedere un minuto)';
  out.innerHTML = '';
  try {
    const d = await fetch('ardy-crea-reel.php', { method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ progetto_id: stato.dettaglio.progetto.id, musica:'casuale' }) }).then(r=>r.json());
    if (d.success && d.reel_url){
      out.innerHTML = `<video src="${d.reel_url}" controls style="max-width:240px;border-radius:var(--radius-sm);border:1px solid var(--border);display:block"></video>
        <div style="margin-top:6px"><a href="${d.reel_url}" download>⬇️ Scarica il reel</a>${d.caption?` · <span class="muted">caption pronta</span>`:''}</div>
        ${d.caption?`<div class="muted" style="margin-top:6px;white-space:pre-wrap">${esc(d.caption)}</div>`:''}`;
      toast('Reel creato');
    } else { out.innerHTML = `<span class="neg">${esc(d.error||'Errore creazione reel')}</span>`; toast(d.error||'Errore'); }
  } catch(e){ out.innerHTML = `<span class="neg">Errore di rete</span>`; }
  btn.disabled = false; btn.textContent = txt;
}
function fasiFormHtml(){
  const ff = stato.faseForm;
  return `
  <div class="panel" style="background:var(--surface2);margin-top:12px">
    <div class="field"><label>Titolo fase</label><input id="ff_nome" value="${esc(ff.fase_nome)}" placeholder="Es. Stampa del corpo lampada"></div>
    <div class="field">
      <label>Testo (racconto breve)</label>
      <textarea id="ff_breve" placeholder="Butta giù due-tre righe; poi 'Scrivi con AI' le trasforma in un post professionale">${esc(ff.testo_breve)}</textarea>
      <div style="margin-top:6px"><button class="sm" id="aiBtn" onclick="generaPostAi()">✨ Scrivi con AI</button>
        <span class="muted" style="margin-left:6px">Tono professionale di brand. Rivedi sempre prima di pubblicare.</span></div>
    </div>
    <div class="field"><label>Foto</label>
      <div class="thumbs">
        ${ff.fotoEsistenti.map((fn,i)=>`<div class="thumbwrap"><img class="thumb" src="${fotoUrlFase(ff.id,fn)}"><button class="x" onclick="rimuoviFotoEsistente(${i})">✕</button></div>`).join('')}
        ${ff.fotoNuove.map((b64,i)=>`<div class="thumbwrap"><img class="thumb" src="data:image/*;base64,${b64}"><button class="x" onclick="rimuoviFotoNuova(${i})">✕</button></div>`).join('')}
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px">
        <label class="filebtn">📷 Scatta foto<input type="file" accept="image/*" capture="environment" multiple onchange="onFotoInput(this)"></label>
        <label class="filebtn">🖼️ Dalla galleria<input type="file" accept="image/*" multiple onchange="onFotoInput(this)"></label>
      </div>
    </div>
    <div class="row">
      <button class="primary" onclick="salvaFase()">Salva fase</button>
      <button class="ghost" onclick="annullaFase()">Annulla</button>
    </div>
  </div>`;
}
async function generaPostAi(){
  captureFaseForm();
  const bozza = (stato.faseForm.testo_breve||'').trim();
  if (!bozza){ toast('Scrivi prima due-tre righe'); return; }
  const btn = document.getElementById('aiBtn');
  if (btn){ btn.disabled = true; btn.textContent = '✨ Scrivo…'; }
  try {
    const d = await fetch('ardy-progetti-ai.php', { method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ mode:'genera_post', progetto_id:stato.dettaglio.progetto.id, fase_nome:stato.faseForm.fase_nome, bozza }) }).then(r=>r.json());
    if (d.success && d.testo){ stato.faseForm.testo_breve = d.testo; renderDettaglio(); toast('Post generato — rivedilo'); }
    else { toast(d.error||'Errore generazione'); if(btn){ btn.disabled=false; btn.textContent='✨ Scrivi con AI'; } }
  } catch(e){ toast('Errore di rete'); if(btn){ btn.disabled=false; btn.textContent='✨ Scrivi con AI'; } }
}
function captureFaseForm(){
  if (!stato.faseForm) return;
  const n=document.getElementById('ff_nome'), b=document.getElementById('ff_breve');
  if (n) stato.faseForm.fase_nome = n.value;
  if (b) stato.faseForm.testo_breve = b.value;
}
function nuovaFase(){ stato.faseForm = { id:0, fase_nome:'', testo_breve:'', fotoEsistenti:[], fotoNuove:[] }; renderDettaglio(); }
function editFase(id){
  const f = stato.dettaglio.fasi.find(x=>x.id===id); if (!f) return;
  stato.faseForm = { id:f.id, fase_nome:f.fase_nome||'', testo_breve:f.testo_breve||'', fotoEsistenti:(f.foto_urls||[]).slice(), fotoNuove:[] };
  renderDettaglio();
}
function annullaFase(){ stato.faseForm = null; renderDettaglio(); }
function rimuoviFotoEsistente(i){ captureFaseForm(); stato.faseForm.fotoEsistenti.splice(i,1); renderDettaglio(); }
function rimuoviFotoNuova(i){ captureFaseForm(); stato.faseForm.fotoNuove.splice(i,1); renderDettaglio(); }
function onFotoInput(input){
  captureFaseForm();
  const files = Array.from(input.files||[]);
  let pending = files.length;
  if (!pending) return;
  files.forEach(file=>{
    const reader = new FileReader();
    reader.onload = ()=>{ stato.faseForm.fotoNuove.push(reader.result.split(',')[1]); if(--pending===0) renderDettaglio(); };
    reader.onerror = ()=>{ if(--pending===0) renderDettaglio(); };
    reader.readAsDataURL(file);
  });
}
async function salvaFase(){
  captureFaseForm();
  const ff = stato.faseForm;
  if (!ff.fase_nome.trim() && !ff.testo_breve.trim()){ toast('Servono titolo o testo'); return; }
  const immagini = [...ff.fotoEsistenti, ...ff.fotoNuove];
  const d = await fetch(FASI_API, { method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ mode:'salva', progetto_id:stato.dettaglio.progetto.id, id:ff.id, fase_nome:ff.fase_nome, testo_breve:ff.testo_breve, immagini }) }).then(r=>r.json());
  if (d.success){ toast('Fase salvata'); stato.faseForm=null; apri(stato.dettaglio.progetto.id); }
  else toast(d.error||'Errore');
}
async function eliminaFase(id){
  if (!confirm('Eliminare questa fase e le sue foto?')) return;
  await fetch(FASI_API, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ mode:'delete', id }) });
  apri(stato.dettaglio.progetto.id);
}

caricaLista();
</script>
</body>
